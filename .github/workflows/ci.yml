name: CI

on:
    push:
        paths:
            - "src/**"
            - "package.json"
            - "pnpm-lock.yaml"
            - "tsconfig*.json"
            - "vite.config.*"
            - "eslint.config.js"
            - "index.html"
            - ".github/workflows/ci.yml"
    pull_request:
        paths:
            - "src/**"
            - "package.json"
            - "pnpm-lock.yaml"
            - "tsconfig*.json"
            - "vite.config.*"
            - "eslint.config.js"
            - "index.html"
            - ".github/workflows/ci.yml"

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 11

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Lint
              run: pnpm lint

            - name: Build
              run: pnpm build

            - name: Generate class diagram
              run: pnpm uml:generate

            - name: Upload class diagram
              uses: actions/upload-artifact@v4
              with:
                  name: diagrama-classes
                  path: docs/diagrama-classes.svg
                  if-no-files-found: error
